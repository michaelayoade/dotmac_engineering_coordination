[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dotmac-engineering-coordination"
version = "0.1.0"
description = "Agent-facing coordination and safe fleet discovery for Dotmac engineering"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastmcp>=2.14.7,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff==0.6.9",
]

[project.scripts]
dotmac-coordination = "dotmac_engineering_coordination.cli:main"
dotmac-coordination-mcp = "dotmac_engineering_coordination.mcp_server:run"

[tool.hatch.build.targets.wheel]
packages = ["src/dotmac_engineering_coordination"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dotmac_engineering_coordination"]
